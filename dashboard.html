<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AmbisEdu Dashboard</title>
<style>
:root{--bg:#f8fafc;--card:#ffffff;--text:#0f1115;--muted:#64748b;--line:#e2e8f0;--accent:#4f46e5;--accent2:#e0e7ff;--star:#eab308;--shadow:0 8px 30px rgba(15,17,21,0.04)}
[data-theme=dark]{--bg:#0f1115;--card:#161920;--text:#f8fafc;--muted:#94a3b8;--line:#222530;--accent:#6366f1;--accent2:#1e1b4b;--star:#facc15;--shadow:0 12px 40px rgba(0,0,0,0.4)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Inter,system-ui,-apple-system,sans-serif;transition:.25s}
button{font:inherit;color:inherit;border:0;cursor:pointer}.layout{display:flex;min-height:100vh}
.sidebar{width:245px;background:var(--card);border-right:1px solid var(--line);padding:25px 16px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:10}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;margin:0 10px 38px}.logo b{background:#0f1115;color:#fff;border-radius:10px;padding:6px 10px;border:1px solid #ffffff20;font-size:16px}[data-theme=dark] .logo b{background:#ffffff;color:#0f1115}
.logo span i{color:var(--star)}
.nav{display:grid;gap:7px}.nav button{background:transparent;text-align:left;padding:13px 14px;border-radius:12px;color:var(--muted);display:flex;gap:12px;align-items:center;width:100%}.nav button:hover,.nav button.active{background:var(--accent2);color:var(--accent);font-weight:700}
.side-foot{margin-top:auto;color:var(--muted);font-size:12px;padding:10px}
.main{margin-left:245px;width:calc(100% - 245px);padding:25px;min-width:0}.top{max-width:1050px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:15px}.greet h1{margin:0;font-size:27px}.greet p{margin:5px 0 0;color:var(--muted)}
.actions{display:flex;gap:9px}
.theme{width:42px;height:42px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:grid;place-items:center;font-size:18px;color:var(--star)}
.profile{max-width:1050px;margin:22px auto 25px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow);position:relative;transition:all 0.3s ease;overflow:hidden}
.profile.hidden-prof{height:50px;padding-top:12px;padding-bottom:12px}.profile.hidden-prof .prof-body{opacity:0;pointer-events:none}
.hide-prof-btn{position:absolute;top:14px;right:16px;background:none;font-size:12px;color:var(--muted);font-weight:600;padding:2px 6px;border-radius:6px}
.hide-prof-btn:hover{background:var(--bg)}
.prof-body{display:flex;align-items:center;gap:16px;width:100%;transition:opacity 0.2s}
.avatar{width:43px;height:43px;border-radius:13px;background:var(--accent2);color:var(--accent);display:grid;place-items:center;font-weight:800}.pdata{display:flex;gap:24px;flex-wrap:wrap}.pdata span{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}.pdata strong{font-size:13px}
.workspace{max-width:1050px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;min-height:450px;box-shadow:var(--shadow);padding:30px}.view{display:none;animation:in .25s ease}.view.active{display:block}@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.view-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.view h2{margin:0;font-size:24px}.view-head p{color:var(--muted);margin:6px 0 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.box{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:20px}.box h3{margin:0 0 8px}.box p{color:var(--muted);line-height:1.55;margin:0}.bottom{display:none}
.chat-window{border:1px solid var(--line);border-radius:18px;background:var(--bg);display:flex;flex-direction:column;height:420px;position:relative}
.chat-header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;border-radius:18px 18px 0 0;display:flex;justify-content:space-between;align-items:center}
.chat-messages{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.msg{max-width:75%;padding:11px 15px;border-radius:14px;line-height:1.5;font-size:14px}
.msg.ai{background:var(--card);color:var(--text);align-self:flex-start;border-bottom-left-radius:4px;border:1px solid var(--line)}
.msg.user{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chat-footer{background:var(--card);border-top:1px solid var(--line);padding:12px;border-radius:0 0 18px 18px;display:flex;flex-direction:column;gap:8px}
.chat-options{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.opt-btn{background:var(--bg);border:1px solid var(--line);color:var(--text);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:500;transition:all 0.2s}
.opt-btn:hover{background:var(--accent2);border-color:var(--accent);color:var(--accent)}
.chat-settings-panel{position:absolute;top:55px;right:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);z-index:30;display:none;width:220px}
.settings-group{margin-bottom:10px}.settings-group label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.settings-group select, .settings-group input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--card);color:var(--text)}
@media(max-width:600px){
.sidebar{display:none}.main{margin:0;width:100%;padding:18px 14px 90px}.top{align-items:flex-start}.greet h1{font-size:22px}.greet p{font-size:13px}.profile{margin:18px auto;padding:14px}.pdata{gap:12px}.workspace{padding:22px 16px;border-radius:18px;min-height:420px}.grid{grid-template-columns:1fr}.view-head{margin-bottom:20px}.view h2{font-size:21px}.bottom{display:flex;position:fixed;z-index:20;bottom:0;left:0;right:0;height:68px;background:var(--card);border-top:1px solid var(--line);justify-content:space-around;padding:7px 4px;box-shadow:0 -8px 25px #0000000c}
.bottom button{background:none;color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 4px;border-radius:10px;width:23%}.bottom button b{font-size:18px;font-weight:500}.bottom button.active{color:var(--accent);background:var(--accent2);font-weight:700}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
<div class="logo"><b>Ambis</b>Edu<span> <i>★</i></span></div>
<nav class="nav" id="sideNav"></nav>
<div class="side-foot" id="sideFoot"></div>
</aside>
<main class="main">
<header class="top">
<div class="greet" id="greetingArea"></div>
<div class="actions"><button class="theme" id="theme">☀️</button></div>
</header>
<section class="profile" id="profile"></section>
<section class="workspace">
<div class="view active" id="chat">
<div class="view-head"><div id="headChat"></div></div>
<div class="chat-window">
  <div class="chat-header">
    <div style="display:flex;align-items:center;gap:8px">
      <div style="width:8px;height:8px;background:#10b981;border-radius:50%"></div>
      <strong style="font-size:14px" id="botTitle">Copilot AI</strong>
    </div>
    <button style="background:none;font-size:14px;padding:4px" onclick="toggleChatSettings()">⚙️</button>
  </div>
  <div class="chat-settings-panel" id="chatSettings">
    <div class="settings-group">
      <label id="lblTone">Tone</label>
      <select id="toneSelect" onchange="updateChatPrefs()">
        <option value="Casual">Casual</option>
        <option value="Professional" selected>Professional</option>
        <option value="Efficient">Efficient</option>
      </select>
    </div>
    <div class="settings-group">
      <label id="lblCall">Callsign</label>
      <input type="text" id="callInput" value="Kak" oninput="updateChatPrefs()">
    </div>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-footer">
    <div class="chat-options" id="chatOptionsArea"></div>
  </div>
</div>
</div>
<div class="view" id="roadmap">
<div class="view-head"><div id="headRoadmap"></div></div>
<div id="cardProgress"></div>
</div>
<div class="view" id="test">
<div class="view-head"><div id="headTest"></div></div>
<div class="test" id="bodyTest"></div>
</div>
<div class="view" id="system">
<div class="view-head"><div id="headSystem"></div></div>
<div class="box" id="bodySystem"></div>
</div>
</section>
</main>
</div>
<nav class="bottom" id="bottomNav"></nav>

<script>
const root=document.documentElement,theme=document.getElementById("theme");
const savedTheme=localStorage.getItem("akademikTheme")||"light";
root.dataset.theme=savedTheme;
theme.textContent=savedTheme==="dark"?"🌙":"☀️";
theme.onclick=()=>{let d=root.dataset.theme==="dark";root.dataset.theme=d?"light":"dark";localStorage.setItem("akademikTheme",d?"light":"dark");theme.textContent=d?"☀️":"🌙"};

let profile={};
try{profile=JSON.parse(localStorage.getItem("akademikProfileV5"))||{}}catch(e){}
const userLang=profile.language||"English";
const edu=profile.educationLevel||"Not set";
const amount=profile.timeAmount||"0";
const unit=profile.timeUnit||"Hours";

const langDict = {
  "English": {
    greetH: "Good evening.", greetP: "Ready to make progress today?", sideFoot: "AmbisEdu Corporate<br>Learn smarter, every day.",
    profTitle: "Your Profile", profLang: "Language", profEdu: "Education", profTime: "Study Time", hide: "Hide Profile", show: "Show Profile", unitH: "Hours", unitM: "Minutes",
    menuChat: "AmbisEdu Chat", menuRoad: "Milestone Tracker", menuTest: "Mock Exam", menuSys: "System Console",
    chatSub: "Your limited-menu academic RAG copilot.", 
    opt1: "University Compatibility", opt2: "Profile Verification", opt3: "Short Study Plan", opt4: "Academic Dialogue",
    welcomeChat: "Hello! I am your Academic Copilot. Select an option below to start our targeted session.",
