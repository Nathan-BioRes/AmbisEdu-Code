<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--accent:#5b5ce2;--accent2:#eef0ff;--shadow:0 12px 35px #17203312}
[data-theme=dark]{--bg:#10131a;--card:#181c25;--text:#f1f5f9;--muted:#9ca3af;--line:#2a303b;--accent:#8586ff;--accent2:#252743;--shadow:0 12px 35px #0005}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Inter,system-ui,-apple-system,sans-serif;transition:.25s}
button{font:inherit;color:inherit;border:0;cursor:pointer}.layout{display:flex;min-height:100vh}
.sidebar{width:245px;background:var(--card);border-right:1px solid var(--line);padding:25px 16px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:10}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;margin:0 10px 38px}.logo b{background:var(--accent);color:#fff;border-radius:10px;padding:8px 9px}
.nav{display:grid;gap:7px}.nav button{background:transparent;text-align:left;padding:13px 14px;border-radius:12px;color:var(--muted);display:flex;gap:12px;align-items:center;width:100%}.nav button:hover,.nav button.active{background:var(--accent2);color:var(--accent);font-weight:700}
.side-foot{margin-top:auto;color:var(--muted);font-size:12px;padding:10px}
.main{margin-left:245px;width:calc(100% - 245px);padding:25px;min-width:0}.top{max-width:1050px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:15px}.greet h1{margin:0;font-size:27px}.greet p{margin:5px 0 0;color:var(--muted)}
.actions{display:flex;gap:9px}.theme{width:42px;height:42px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:grid;place-items:center;font-size:18px}
.profile{max-width:1050px;margin:22px auto 25px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow);position:relative;transition:all 0.3s ease;overflow:hidden}
.profile.hidden-prof{height:50px;padding-top:12px;padding-bottom:12px}.profile.hidden-prof .prof-body{opacity:0;pointer-events:none}
.hide-prof-btn{position:absolute;top:14px;right:16px;background:none;font-size:12px;color:var(--muted);font-weight:600}
.prof-body{display:flex;align-items:center;gap:16px;width:100%;transition:opacity 0.2s}
.avatar{width:43px;height:43px;border-radius:13px;background:var(--accent2);color:var(--accent);display:grid;place-items:center;font-weight:800}.pdata{display:flex;gap:24px;flex-wrap:wrap}.pdata span{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}.pdata strong{font-size:13px}
.workspace{max-width:1050px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;min-height:450px;box-shadow:var(--shadow);padding:30px}.view{display:none;animation:in .25s ease}.view.active{display:block}@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.view-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.view h2{margin:0;font-size:24px}.view-head p{color:var(--muted);margin:6px 0 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.box{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:20px}.box h3{margin:0 0 8px}.box p{color:var(--muted);line-height:1.55;margin:0}.chat{height:300px;border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:var(--muted);padding:20px}.chat strong{font-size:20px;color:var(--text);margin-bottom:7px}.progress{height:9px;background:var(--line);border-radius:20px;overflow:hidden;margin:18px 0}
.progress i{display:block;height:100%;width:62%;background:var(--accent);border-radius:20px}.test{display:flex;align-items:center;justify-content:center;min-height:300px;text-align:center}.test button{margin-top:18px;padding:11px 18px;background:var(--accent);color:#fff;border-radius:10px;font-weight:700}.bottom{display:none}
@media(max-width:600px){
.sidebar{display:none}.main{margin:0;width:100%;padding:18px 14px 90px}.top{align-items:flex-start}.greet h1{font-size:22px}.greet p{font-size:13px}.profile{margin:18px auto;padding:14px}.pdata{gap:12px}.workspace{padding:22px 16px;border-radius:18px;min-height:420px}.grid{grid-template-columns:1fr}.view-head{margin-bottom:20px}.view h2{font-size:21px}.bottom{display:flex;position:fixed;z-index:20;bottom:0;left:0;right:0;height:68px;background:var(--card);border-top:1px solid var(--line);justify-content:space-around;padding:7px 4px;box-shadow:0 -8px 25px #0000000c}
.bottom button{background:none;color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 4px;border-radius:10px;width:23%}.bottom button b{font-size:18px;font-weight:500}.bottom button.active{color:var(--accent);background:var(--accent2);font-weight:700}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
<div class="logo"><b>AC</b> AkademikCopilot</div>
<nav class="nav" id="sideNav"></nav>
<div class="side-foot" id="sideFoot"></div>
</aside>
<main class="main">
<header class="top">
<div class="greet" id="greetingArea"></div>
<div class="actions"><button class="theme" id="theme">☀️</button></div>
</header>
<section class="profile" id="profile"></section>
<section class="workspace">
<div class="view active" id="chat">
<div class="view-head"><div id="headChat"></div></div>
<div class="chat" id="bodyChat"></div>
</div>
<div class="view" id="roadmap">
<div class="view-head"><div id="headRoadmap"></div></div>
<div class="box" id="cardProgress"></div>
<div class="grid" style="margin-top:15px" id="gridRoadmap"></div>
</div>
<div class="view" id="test">
<div class="view-head"><div id="headTest"></div></div>
<div class="test" id="bodyTest"></div>
</div>
<div class="view" id="system">
<div class="view-head"><div id="headSystem"></div></div>
<div class="box" id="bodySystem"></div>
</div>
</section>
</main>
</div>
<nav class="bottom" id="bottomNav"></nav>
<script>
const root=document.documentElement,theme=document.getElementById("theme");
const savedTheme=localStorage.getItem("akademikTheme")||"light";
root.dataset.theme=savedTheme;
theme.textContent=savedTheme==="dark"?"🌙":"☀️";
theme.onclick=()=>{let d=root.dataset.theme==="dark";root.dataset.theme=d?"light":"dark";localStorage.setItem("akademikTheme",d?"light":"dark");theme.textContent=d?"☀️":"🌙"};

let profile={};
try{profile=JSON.parse(localStorage.getItem("akademikProfileV5"))||{}}catch(e){}
const userLang=profile.language||"English";
const edu=profile.educationLevel||"Not set";
const amount=profile.timeAmount||"0";
const unit=profile.timeUnit||"Hours";

const langDict = {
  "English": {
    greetH: "Good evening.", greetP: "Ready to make progress today?", sideFoot: "Your academic copilot<br>Learn smarter, every day.",
    profTitle: "Your Profile", profLang: "Language", profEdu: "Education", profTime: "Study Time", hide: "Hide", show: "Show Profile", unitH: "Hours", unitM: "Minutes",
    menuChat: "AI Chatbot", menuRoad: "Roadmap Tracker", menuTest: "Mock Test", menuSys: "System Settings",
    chatSub: "Your personal academic assistant.", chatMain: "How can I help you learn?", chatDesc: "Ask about concepts, study plans, assignments, or your next learning step.",
    roadSub: "Keep your learning journey on track.", roadProgress: "Current Progress", roadHabit: "Complete your learning milestones and build consistent study habits.", roadOf: "of your current roadmap", roadF: "Foundations", roadC: "Core Skills", roadA: "Advanced", statusComp: "Completed", statusProg: "In progress", statusUp: "Upcoming",
    testSub: "Practice under realistic test conditions.", testTitle: "Ready for a challenge?", testDesc: "Your personalized mock tests will appear here.", testBtn: "Start Mock Test",
    sysSub: "Configure backend parameters.", sysTitle: "System Setup", sysDesc: "Placeholder for account management, API verification, and authentication settings via database triggers."
  },
  "Bahasa Indonesia": {
    greetH: "Selamat malam.", greetP: "Siap untuk berkembang hari ini?", sideFoot: "Copilot akademik Anda<br>Belajar lebih cerdas, setiap hari.",
    profTitle: "Profil Anda", profLang: "Bahasa", profEdu: "Pendidikan", profTime: "Waktu Belajar", hide: "Sembunyikan", show: "Tampilkan Profil", unitH: "Jam", unitM: "Menit",
    menuChat: "AI Chatbot", menuRoad: "Pelacak Roadmap", menuTest: "Ujian Tiruan", menuSys: "Pengaturan Sistem",
    chatSub: "Asisten akademik pribadi Anda.", chatMain: "Ada yang bisa saya bantu pelajari?", chatDesc: "Tanyakan tentang konsep, rencana studi, tugas, atau langkah belajar Anda berikutnya.",
    roadSub: "Jaga agar perjalanan belajar Anda tetap sesuai jalur.", roadProgress: "Progres Saat Ini", roadHabit: "Selesaikan target belajar Anda dan bangun kebiasaan belajar yang konsisten.", roadOf: "dari total roadmap Anda", roadF: "Dasar-Dasar", roadC: "Keahlian Inti", roadA: "Tingkat Lanjut", statusComp: "Selesai", statusProg: "Sedang berjalan", statusUp: "Mendatang",
    testSub: "Latihan di bawah kondisi ujian yang realistis.", testTitle: "Siap menghadapi tantangan?", testDesc: "Ujian tiruan yang dipersonalisasi akan muncul di sini.", testBtn: "Mulai Ujian",
    sysSub: "Konfigurasi parameter backend.", sysTitle: "Pengaturan Sistem", sysDesc: "Wadah penampung untuk manajemen akun, verifikasi API, dan pengaturan autentikasi menggunakan pemicu database."
  }
};

const d = langDict[userLang] || langDict["English"];
const displayUnit = unit === "Hours" ? d.unitH : d.unitM;

document.getElementById("greetingArea").innerHTML = '<h1>'+d.greetH+'</h1><p>'+d.greetP+'</p>';
document.getElementById("sideFoot").innerHTML = d.sideFoot;

const profileEl = document.getElementById("profile");
